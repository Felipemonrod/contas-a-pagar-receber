# Configuracao usada apenas pelos testes.
#
# Os testes rodam contra um H2 em memoria para que "mvnw test" funcione sem
# depender do MySQL estar no ar. Sem isto, quem clona o repositorio e roda o
# build sem subir o Docker ve o build falhar.
#
# O schema aqui e gerado pelo Hibernate a partir das entidades. As migrations
# do Flyway sao especificas de MySQL (ENGINE=InnoDB) e continuam sendo
# validadas na execucao real da aplicacao.

spring.datasource.url=jdbc:h2:mem:cpr_teste;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.flyway.enabled=false
