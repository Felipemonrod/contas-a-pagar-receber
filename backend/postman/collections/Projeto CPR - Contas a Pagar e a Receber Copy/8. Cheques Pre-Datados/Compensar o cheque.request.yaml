$kind: http-request
url: "{{baseUrl}}/cheques/{{chequeId}}/situacao"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "situacao": "COMPENSADO"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
order: 7000
