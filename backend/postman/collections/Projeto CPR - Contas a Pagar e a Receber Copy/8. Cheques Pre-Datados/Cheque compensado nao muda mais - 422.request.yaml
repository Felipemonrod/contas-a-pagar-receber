$kind: http-request
url: "{{baseUrl}}/cheques/{{chequeId}}/situacao"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "situacao": "DEVOLVIDO"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('422 Unprocessable Entity', () => pm.response.to.have.status(422));
    language: text/javascript
order: 8000
