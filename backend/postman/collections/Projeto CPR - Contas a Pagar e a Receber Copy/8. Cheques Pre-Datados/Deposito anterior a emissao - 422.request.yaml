$kind: http-request
url: "{{baseUrl}}/cheques"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "numeroCheque": "000453",
      "pessoaId": {{clienteId}},
      "contaCorrenteId": {{contaCorrenteId}},
      "emissao": "2026-10-01",
      "deposito": "2026-09-20",
      "valor": 100.00
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('422 Unprocessable Entity', () => pm.response.to.have.status(422));
    language: text/javascript
order: 3000
