$kind: http-request
url: "{{baseUrl}}/pessoas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nome": "Fornecedor Puro Ltda",
      "documento": "11.111.111/0001-11",
      "papeis": ["FORNECEDOR"]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('fornecedorId', pm.response.json().id);
    language: text/javascript
order: 3000
