$kind: http-request
name: Cadastrar fornecedor e cliente (N:N de papeis)
url: "{{baseUrl}}/pessoas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nome": "Greensoft Informatica Ltda",
      "documento": "33.537.659/0007-11",
      "papeis": ["FORNECEDOR", "CLIENTE"],
      "email": "contato@greensoft.com.br",
      "contato": "Wilson",
      "telefones": [
        { "numero": "(11) 5585-4975", "ramal": "201", "tipo": "COMERCIAL" },
        { "numero": "(11) 5584-2545", "tipo": "FAX" }
      ],
      "enderecos": [
        {
          "logradouro": "Av. Paulista",
          "numero": "1439",
          "bairro": "Bela Vista",
          "cep": "01311-200",
          "cidade": "Sao Paulo",
          "uf": "SP",
          "principal": true
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('pessoaId', pm.response.json().id);
      pm.test('tem os dois papeis', () => {
        pm.expect(pm.response.json().papeis).to.include.members(['FORNECEDOR','CLIENTE']);
      });
    language: text/javascript
order: 1000
