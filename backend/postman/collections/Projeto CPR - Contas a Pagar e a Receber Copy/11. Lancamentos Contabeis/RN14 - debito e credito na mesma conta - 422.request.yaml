$kind: http-request
url: "{{baseUrl}}/lancamentos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "contaDebitoId": 10,
      "contaCreditoId": 10,
      "valor": 100.00,
      "descricao": "Lancamento incoerente",
      "data": "2026-10-10"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('422 Unprocessable Entity', () => pm.response.to.have.status(422));
    language: text/javascript
order: 2000
