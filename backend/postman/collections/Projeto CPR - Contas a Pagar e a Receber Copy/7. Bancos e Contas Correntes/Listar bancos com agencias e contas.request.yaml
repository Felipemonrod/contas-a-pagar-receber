$kind: http-request
url: "{{baseUrl}}/bancos"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('o banco cadastrado traz a agencia junto', () => {
        const banco = pm.response.json()
          .find(b => b.id === pm.collectionVariables.get('bancoId'));
        pm.expect(banco.agencias.length).to.be.above(0);
      });
    language: text/javascript
order: 4000
