$kind: http-request
url: "{{baseUrl}}/contas-receber/{{contaReceberId}}/recebimento"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dataRecebimento": "2026-10-10",
      "formaPagamento": "PIX"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('situacao vira RECEBIDA', () => {
        pm.expect(pm.response.json().situacao).to.eql('RECEBIDA');
      });
    language: text/javascript
order: 3000
