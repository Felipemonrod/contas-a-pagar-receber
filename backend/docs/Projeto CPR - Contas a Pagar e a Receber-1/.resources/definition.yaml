name: Projeto CPR - Contas a Pagar e a Receber
description: |-
  Colecao de testes da API do Projeto Integrador de Sistemas Distribuidos (IF Goiano - Morrinhos).

  As requisicoes estao em ordem de execucao: rode de cima para baixo em uma base recem-criada e o fluxo completo funciona. As variaveis pessoaId, contaPagarId, contaReceberId e despesaId sao preenchidas automaticamente pelos scripts de teste.

  Pasta '9. Cenarios de Erro' reune as regras de negocio que devem ser recusadas - use para as evidencias de teste da documentacao.
