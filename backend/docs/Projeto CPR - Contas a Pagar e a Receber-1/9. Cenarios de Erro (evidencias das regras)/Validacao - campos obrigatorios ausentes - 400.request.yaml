$kind: http-request
name: Validacao - campos obrigatorios ausentes -> 400
url: "{{baseUrl}}/contas-pagar"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "valor": -5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400', () => pm.response.to.have.status(400));
      pm.test('lista os campos invalidos', () => {
        pm.expect(pm.response.json().campos.length).to.be.above(0);
      });
    language: text/javascript
order: 7000
