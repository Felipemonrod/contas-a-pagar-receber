$kind: http-request
name: "A fatura chegou: gerar titulo com o valor REAL"
url: "{{baseUrl}}/despesas/{{despesaId}}/gerar-titulo"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "numeroTitulo": "ENEL-778899",
      "pessoaId": {{pessoaId}},
      "valor": 187.45,
      "emissao": "2026-12-01",
      "vencimento": "2026-12-15"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('despesa virou titulo', () => {
        pm.expect(pm.response.json().realizada).to.eql(true);
        pm.expect(pm.response.json().numeroTitulo).to.eql('ENEL-778899');
      });
    language: text/javascript
order: 2000
