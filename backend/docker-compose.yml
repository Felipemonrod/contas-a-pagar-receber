services:
  mysql:
    image: mysql:8.4
    container_name: cpr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cpr
      MYSQL_USER: cpr
      MYSQL_PASSWORD: cpr
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=-03:00
    volumes:
      - cpr-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucpr", "-pcpr"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  cpr-mysql-data:
