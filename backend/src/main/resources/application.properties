spring.application.name=contas-pagar-receber

# ---- Banco de dados (MySQL em Docker: docker compose up -d) ----
spring.datasource.url=jdbc:mysql://localhost:3306/cpr?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=cpr
spring.datasource.password=cpr
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA ----
# O schema e criado e versionado pelo Flyway; o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---- Formato de data padrao brasileiro na serializacao ----
spring.jackson.time-zone=America/Sao_Paulo

# ---- CORS: origens do front-end em desenvolvimento ----
cpr.cors.origens=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
